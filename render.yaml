    name: nutricion-ia
    env: node
    plan: starter
    buildCommand: npm install && node build.js
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
